name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static files
        run: |
          mkdir -p public
          cp index.html results.html survey-results.js config.js public/
          survey_version=$(sha256sum survey-results.js | cut -c1-12)
          config_version=$(sha256sum config.js | cut -c1-12)
          sed -i -E "s/survey-results\.js\?v=[a-z0-9]+/survey-results.js?v=${survey_version}/g; s/config\.js\?v=[a-z0-9]+/config.js?v=${config_version}/g" public/index.html public/results.html

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
